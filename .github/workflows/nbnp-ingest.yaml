# Checks tools/nbnp-ingest, publishes its vips image when the Dockerfile changes on dev, and
# releases a static binary for a tag nbnp-ingest-vX.Y.Z (the version in Cargo.toml).
#
# The toolchain is pinned so a Rust release cannot fail a run by itself: clippy denies every
# default lint and the run denies warnings, so a new lint would. Bump it deliberately.
name: nbnp-ingest

on:
  push:
    branches: [dev, prod]
    # Path filters do not apply to tags: a release tag always runs.
    tags: ['nbnp-ingest-v*']
    paths:
      - 'tools/nbnp-ingest/**'
      - '.github/workflows/nbnp-ingest.yaml'
  pull_request:
    paths:
      - 'tools/nbnp-ingest/**'
      - '.github/workflows/nbnp-ingest.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nbnp-ingest-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/nbnp-ingest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/nbnp-ingest -> target

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: tests
        run: cargo test --locked

  vips-image:
    # On dev: pushes build when the Dockerfile changed; a manual run always builds.
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Compare the whole push, not just its last commit. A manual run, a new
      # branch, or a force push whose old head is gone builds unconditionally.
      - name: Did the Dockerfile change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == workflow_dispatch || "$BEFORE" =~ ^0+$ ]] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- tools/nbnp-ingest/docker/vips; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.changed.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.build == 'true'
        with:
          context: tools/nbnp-ingest/docker/vips
          push: true
          tags: |
            ghcr.io/unb-libraries/nbnp-ingest-vips:bookworm
            ghcr.io/unb-libraries/nbnp-ingest-vips:${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/nbnp-ingest-v')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/nbnp-ingest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-musl

      # ring compiles a little C; musl-gcc makes it link statically.
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "nbnp-ingest-v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Build the static binary
        run: |
          NBNP_INGEST_COMMIT="${GITHUB_SHA::8}" \
            cargo build --release --locked --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/nbnp-ingest
          file "$bin" | grep -q 'static' || { echo "not a static binary" >&2; exit 1; }
          "$bin" --version
          cp "$bin" nbnp-ingest-x86_64-linux
          sha256sum nbnp-ingest-x86_64-linux > nbnp-ingest-x86_64-linux.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" nbnp-ingest-x86_64-linux nbnp-ingest-x86_64-linux.sha256 \
            --title "$TAG" --notes "Static x86_64 Linux build of tools/nbnp-ingest at ${GITHUB_SHA::8}."
