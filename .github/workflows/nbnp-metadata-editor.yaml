# Checks tools/nbnp-metadata-editor: Windows PowerShell 5.1 compatibility, the Pester tests,
# and that nbnp-ingest check accepts the files the editor saves, then drives the real window on
# a Windows runner (tests/ui). Runs when either changes.
# For a tag nbnp-metadata-editor-vX.Y.Z (the version in Edit-NbnpMetadata.ps1), also releases
# the ZIP file that Windows users download.
name: nbnp-metadata-editor

on:
  push:
    branches: [dev, prod]
    # Path filters do not apply to tags: a release tag always runs.
    tags: ['nbnp-metadata-editor-v*']
    paths:
      - 'tools/nbnp-metadata-editor/**'
      - 'tools/nbnp-ingest/**'
      - '.github/workflows/nbnp-metadata-editor.yaml'
  pull_request:
    paths:
      - 'tools/nbnp-metadata-editor/**'
      - 'tools/nbnp-ingest/**'
      - '.github/workflows/nbnp-metadata-editor.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nbnp-metadata-editor-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same toolchain as the nbnp-ingest workflow.
  RUST_VERSION: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/nbnp-ingest -> target

      - name: tests
        run: tools/nbnp-metadata-editor/tests/run-tests.sh

  # Drives the real window in Windows PowerShell 5.1 with UI Automation: tests/ui.
  ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Students' screens are at least 1920 x 1080; the runner starts at 1024 x 768.
      - name: Screen of 1920 x 1080
        shell: powershell
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: UI tests
        shell: powershell
        run: tools/nbnp-metadata-editor/tests/ui/Invoke-UiTests.ps1 -Shots "$env:RUNNER_TEMP\nbnp-ui-shots"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbnp-metadata-editor-ui-screenshots
          path: ${{ runner.temp }}/nbnp-ui-shots
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/nbnp-metadata-editor-v')
    needs: [checks, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # package.sh refuses a tag that does not match the version in Edit-NbnpMetadata.ps1.
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: tools/nbnp-metadata-editor/package.sh .

      # Not marked latest: the repository's latest release stays the nbnp-ingest binary.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" nbnp-metadata-editor-*.zip nbnp-metadata-editor-*.zip.sha256 \
            --latest=false --title "$TAG" \
            --notes "NBNP metadata editor for Windows, at ${GITHUB_SHA::8}. Download the ZIP file, extract it, and double-click Install.cmd: see README.md inside."
