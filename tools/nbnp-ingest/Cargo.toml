[package]
name = "nbnp-ingest"
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
authors = ["UNB Libraries <systems@lib.unb.ca>"]
description = "Imports and audits digitized newspaper issues for newspapers.lib.unb.ca"
license = "MIT"
publish = false

[dependencies]
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "credentials-process"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry", "std"] }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3.27"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# A binary's internal modules, not a published API: `# Errors` sections would
# restate the error enums.
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
