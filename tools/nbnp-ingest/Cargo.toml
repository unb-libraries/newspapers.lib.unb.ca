[package]
name = "nbnp-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["UNB Libraries <systems@lib.unb.ca>"]
description = "Imports and audits digitized newspaper issues for newspapers.lib.unb.ca"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# A binary's internal modules, not a published API: `# Errors` sections would
# restate the error enums.
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
